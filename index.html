<!doctype html>
<html lang="it" data-theme="auto" data-size="normale">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1d4f9c">
  <title>DF Padel Cup</title>
  <script>
    // Applica tema e dimensione del testo prima del disegno, per evitare lampi di colore.
    try {
      var p = JSON.parse(localStorage.getItem('ppt.prefs') || '{}');
      document.documentElement.dataset.theme = p.theme || 'auto';
      document.documentElement.dataset.size = p.size || 'normale';
    } catch (e) { /* preferenze non disponibili */ }
  </script>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect x='27' y='40' width='10' height='20' rx='4' fill='%231d4f9c'/><ellipse cx='32' cy='24' rx='20' ry='22' fill='%231d4f9c'/><circle cx='48' cy='48' r='10' fill='%23d4f53c'/></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="hero">
    <svg class="court-deco" viewBox="0 0 400 200" preserveAspectRatio="none" aria-hidden="true">
      <rect x="2" y="2" width="396" height="196" />
      <line x1="200" y1="2" x2="200" y2="198" />
      <line x1="70" y1="2" x2="70" y2="198" />
      <line x1="330" y1="2" x2="330" y2="198" />
      <line x1="70" y1="100" x2="330" y2="100" />
    </svg>
    <div class="hero-inner">
      <svg class="logo" viewBox="0 0 64 64" aria-hidden="true">
        <rect x="27" y="40" width="10" height="20" rx="4" class="logo-handle" />
        <ellipse cx="30" cy="24" rx="20" ry="22" class="logo-head" />
        <g class="logo-holes">
          <circle cx="24" cy="15" r="2.2" /><circle cx="32" cy="13" r="2.2" /><circle cx="40" cy="17" r="2.2" />
          <circle cx="20" cy="24" r="2.2" /><circle cx="28" cy="22" r="2.2" /><circle cx="36" cy="24" r="2.2" />
          <circle cx="24" cy="32" r="2.2" /><circle cx="32" cy="31" r="2.2" />
        </g>
        <circle cx="49" cy="47" r="10" class="logo-ball" />
        <path d="M41 43c5 1 9 5 10 12M50 37c1 5 5 9 9 10" class="logo-seam" />
      </svg>
      <div>
        <div class="brand-name">DF Padel Cup <span class="version" id="appVersion" title="Versione del programma"></span></div>
        <div class="brand-sub" id="currentName"></div>
      </div>
    </div>
  </header>

  <nav class="tabs" id="tabs" aria-label="Sezioni">
    <button data-tab="tornei">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 4h8v5a4 4 0 0 1-8 0V4zM8 6H5v1a3 3 0 0 0 3 3M16 6h3v1a3 3 0 0 1-3 3M12 13v4M8 20h8M10 17h4v3h-4z"/></svg>
      <span>Tornei</span>
    </button>
    <button data-tab="coppie">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3.2"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/><circle cx="17" cy="9" r="2.6"/><path d="M15.5 14.2c3 .2 5.5 2.6 5.5 5.8"/></svg>
      <span>Coppie</span>
    </button>
    <button data-tab="calendario">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4M7.5 14h2M11 14h2M14.5 14h2M7.5 17h2M11 17h2"/></svg>
      <span>Calendario</span>
    </button>
    <button data-tab="gironi">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.5"/></svg>
      <span>Gironi</span>
    </button>
    <button data-tab="classifica">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 20V9h6v11M3 20v-7h6M15 20v-4h6v4M2 20h20"/></svg>
      <span>Classifica</span>
    </button>
    <button data-tab="tabellone">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 5h5v4H3M3 15h5v4H3M8 7h3v10H8M11 12h4M15 10h6v4h-6z"/></svg>
      <span>Tabellone</span>
    </button>
    <button data-tab="impostazioni">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg>
      <span>Impostazioni</span>
    </button>
  </nav>

  <main id="view"></main>
  <div id="toast" role="status" aria-live="polite"></div>

  <script src="js/core.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/help.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
